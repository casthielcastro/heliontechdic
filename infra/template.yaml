AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HeliOn - TanStack Start SSR on Lambda (function URL) + S3 static assets behind CloudFront. Pay-per-use only.

Parameters:
  BedrockModelId: { Type: String, Default: us.amazon.nova-lite-v1:0 }
  SupabaseUrl: { Type: String, Default: "" }
  SupabasePublishableKey: { Type: String, Default: "" }
  DomainName: { Type: String, Default: "", Description: "Apex custom domain (www alias added too); empty = CloudFront default domain" }
  CertificateArn: { Type: String, Default: "", Description: "ACM cert (us-east-1) covering DomainName + www" }
  HostedZoneId: { Type: String, Default: "", Description: "Route 53 zone for DomainName; empty = no DNS records" }
  OriginSecret: { Type: String, NoEcho: true, MinLength: 16, Description: "Secret header value CloudFront sends to the Lambda origin (X-Origin-Verify)" }
  AlertEmail: { Type: String, Default: casthiel.cloud@gmail.com }
  DailyQuota: { Type: Number, Default: 2000, Description: "Max AI calls per day (global)" }

Conditions:
  HasDomain: !And [!Not [!Equals [!Ref DomainName, ""]], !Not [!Equals [!Ref CertificateArn, ""]]]
  HasDns: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]

Resources:
  SsrFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.output/server
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 25
      LoggingConfig: { LogGroup: !Ref SsrLogGroup, LogFormat: Text }
      Environment:
        Variables:
          NODE_ENV: production
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_PUBLISHABLE_KEY: !Ref SupabasePublishableKey
          TABLE_NAME: !Ref TelemetryTable
          TOPIC_ARN: !Ref FeedbackTopic
          ORIGIN_SECRET: !Ref OriginSecret
          DAILY_QUOTA: !Ref DailyQuota
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TelemetryTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt FeedbackTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0
      FunctionUrlConfig:
        AuthType: NONE

  SsrLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/helion/${AWS::StackName}-ssr", RetentionInDays: 14 }

  TelemetryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }, { AttributeName: sk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: !Sub "${AWS::StackName}-feedback", DisplayName: HeliOn }
  FeedbackEmail:
    Type: AWS::SNS::Subscription
    Properties: { TopicArn: !Ref FeedbackTopic, Protocol: email, Endpoint: !Ref AlertEmail }
  AlarmsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref FeedbackTopic]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref FeedbackTopic

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HeliOn Lambda errors > 5 in 5 min
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SsrFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref FeedbackTopic]
  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HeliOn Lambda throttles > 0
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref SsrFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref FeedbackTopic]

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-html"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-stale-assets
            Status: Enabled
            TagFilters: [{ Key: stale, Value: "true" }]
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AssetsOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  LogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerPreferred }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      LifecycleConfiguration: { Rules: [{ Id: expire-logs, Status: Enabled, ExpirationInDays: 30 }] }

  ScannerBlockFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-scanner-block"
      AutoPublish: true
      FunctionConfig: { Comment: Return 404 at edge for vulnerability-scanner paths, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        var EXT = /\.(php\d?|phtml|aspx?|ashx|asmx|jsp|jspx|cgi|pl|env|ini|bak|old|orig|swp|sql|sqlite|db|zip|tar|gz|tgz|rar|7z|log|pem|key|conf|cfg|yml|yaml|toml|sh|py|rb|xml\.bak)$/i;
        var SEG = /^\/(wp-[^\/]*|wordpress|cgi-bin|phpmyadmin|pma|myadmin|xmlrpc|vendor|node_modules|actuator|server-status|owa|boaform|HNAP1|solr|telescope|debug|admin\.|backup|config|credentials?|secrets?|aws|docker)([\/._-]|$)/i;
        var JSON_SECRET = /(credential|secret|config|settings|appsettings|database|db|keys?|aws|firebase|parameters|composer|package-lock|auth)[^\/]*\.json$/i;
        function handler(event) {
          var uri = event.request.uri;
          var blocked = false;
          if (uri.indexOf('/.well-known/') !== 0 && /\/\./.test(uri)) blocked = true;
          else if (EXT.test(uri) || SEG.test(uri) || JSON_SECRET.test(uri)) blocked = true;
          if (!blocked) return event.request;
          return { statusCode: 404, statusDescription: 'Not Found',
            headers: { 'content-type': { value: 'text/plain' }, 'cache-control': { value: 'public, max-age=86400' }, 'x-blocked-by': { value: 'edge' } },
            body: 'Not Found' };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Logging: { Bucket: !GetAtt LogsBucket.RegionalDomainName, Prefix: cloudfront/, IncludeCookies: false }
        Aliases: !If [HasDomain, [!Ref DomainName, !Sub "www.${DomainName}"], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: ssr
            DomainName: !Select [2, !Split ["/", !GetAtt SsrFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret }]
          - Id: assets
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AssetsOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: ssr
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          CachePolicyId: !Ref HtmlCachePolicy                          # honors origin s-maxage
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ScannerBlockFunction.FunctionMetadata.FunctionARN }]
        CacheBehaviors:
          - PathPattern: /_serverFn/*
            TargetOriginId: ssr
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ScannerBlockFunction.FunctionMetadata.FunctionARN }]
          - PathPattern: /api/*
            TargetOriginId: ssr
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt ScannerBlockFunction.FunctionMetadata.FunctionARN }]
          - PathPattern: /assets/*
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /robots.txt
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /sitemap.xml
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /favicon.ico
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - PathPattern: /og.png
            TargetOriginId: assets
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # CachingOptimized
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  DnsApexA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  DnsApexAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  DnsWwwA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  DnsWwwAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  LogsBucketName:
    Value: !Ref LogsBucket
  SiteUrl: { Value: !Sub "https://${Distribution.DomainName}" }
  AssetsBucketName: { Value: !Ref AssetsBucket }
  FunctionUrl: { Value: !GetAtt SsrFunctionUrl.FunctionUrl }
  TableName: { Value: !Ref TelemetryTable }
  TopicArn: { Value: !Ref FeedbackTopic }
  CustomUrl: { Condition: HasDomain, Value: !Sub "https://${DomainName}" }
