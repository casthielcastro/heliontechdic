<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Muita gente ao mesmo tempo · HELION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />
    <style>
      body { font: 15px/1.5 system-ui, -apple-system, sans-serif; background: #050505; color: #F5F5F7; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
      .card { max-width: 28rem; width: 100%; text-align: center; padding: 2rem; }
      .sun { width: 3rem; height: 3rem; margin: 0 auto 1.25rem; border-radius: 50%; background: radial-gradient(circle, #F59E0B 0 40%, rgba(245,158,11,.25) 41% 70%, transparent 71%); }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #A1A1AA; margin: 0 0 1.5rem; }
      .actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
      a, button { min-height: 2.75rem; padding: 0.5rem 1rem; border-radius: 0.375rem; font: inherit; cursor: pointer; text-decoration: none; border: 1px solid transparent; display: inline-flex; align-items: center; }
      .primary { background: #F59E0B; color: #050505; }
      .secondary { background: transparent; color: #F5F5F7; border-color: #3f3f46; }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="sun" aria-hidden="true"></div>
      <h1>O HELION está um pouco sobrecarregado</h1>
      <p>Muita gente pediu ao mesmo tempo. Espere alguns segundos e tente de novo.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Tentar de novo</button>
        <a class="secondary" href="/">Voltar ao início</a>
      </div>
    </main>
  </body>
</html>
